<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page bientôt disponible</title><style>
:root{--bg:#F3F6F4;--paper:#fff;--ink:#12231B;--muted:#5A6B62;--green:#1D5A44;--line:#D3DDD7;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root{--bg:#0E1813;--paper:#16241D;--ink:#E8F0EB;--muted:#9BB0A5;--green:#5FB594;--line:#2B3C34}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 14px 60px}h1{font-size:22px;margin:6px 4px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.card p{margin:0 0 8px}.muted{color:var(--muted)}.nl a{display:inline-block;margin:6px 6px 0 0}
.nav{position:sticky;top:0;z-index:7;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.nav .row{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:640px;margin:0 auto}
.nav .row+.row{margin-top:6px}
.nav select{width:100%;height:42px;border:1px solid var(--green);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:0 10px}
.nav a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.nav .pn{font-size:13px;color:var(--muted)}
.nav .sp{min-width:90px}
.nav .hint{max-width:640px;margin:4px auto 0;text-align:center;font-size:12px;color:var(--muted)}
</style></head><body>
<div id="navbox"></div>
<main><h1 id="t">Page bientôt disponible</h1><div class="card"><p id="s" class="muted"></p><p>Cette page <b>n’est pas encore disponible</b>. Elle arrive bientôt.</p><p class="muted">En attendant, choisis une autre sourate avec le menu en haut, ou ouvre une page déjà prête :</p><div class="nl" id="ready"></div></div></main>
<script>
var TABLE=[{"n": 1, "name": "Al-Fâtiha", "page": 1, "code": "a"}, {"n": 87, "name": "Al-A'la", "page": 591, "code": "s87"}, {"n": 88, "name": "Al-Ghashiyah", "page": 592, "code": "s88"}, {"n": 89, "name": "Al-Fajr", "page": 593, "code": "s89"}, {"n": 90, "name": "Al-Balad", "page": 594, "code": "s90"}, {"n": 91, "name": "Ash-Shams", "page": 595, "code": "s91"}, {"n": 92, "name": "Al-Layl", "page": 595, "code": "s92"}, {"n": 93, "name": "Ad-Duha", "page": 596, "code": "s93"}, {"n": 94, "name": "Ash-Sharh", "page": 596, "code": "s94"}, {"n": 95, "name": "At-Tin", "page": 597, "code": "s95"}, {"n": 96, "name": "Al-'Alaq", "page": 597, "code": "s96"}, {"n": 97, "name": "Al-Qadr", "page": 598, "code": "s97"}, {"n": 98, "name": "Al-Bayyinah", "page": 598, "code": "s98"}, {"n": 99, "name": "Az-Zalzalah", "page": 599, "code": "s99"}, {"n": 100, "name": "Al-'Adiyat", "page": 599, "code": "s100"}, {"n": 101, "name": "Al-Qari'ah", "page": 600, "code": "s101"}, {"n": 102, "name": "At-Takathur", "page": 600, "code": "s102"}, {"n": 103, "name": "Al-'Asr", "page": 601, "code": "s103"}, {"n": 104, "name": "Al-Humazah", "page": 601, "code": "s104"}, {"n": 105, "name": "Al-Fil", "page": 601, "code": "s105"}, {"n": 106, "name": "Quraysh", "page": 602, "code": "s106"}, {"n": 107, "name": "Al-Ma'un", "page": 602, "code": "s107"}, {"n": 108, "name": "Al-Kawthar", "page": 602, "code": "s108"}, {"n": 109, "name": "Al-Kafirun", "page": 603, "code": "k"}, {"n": 110, "name": "An-Nasr", "page": 603, "code": "r"}, {"n": 111, "name": "Al-Masad", "page": 603, "code": "m"}, {"n": 112, "name": "Al-Ikhlas", "page": 604, "code": "i"}, {"n": 113, "name": "Al-Falaq", "page": 604, "code": "f"}, {"n": 114, "name": "An-Nas", "page": 604, "code": "n"}],BUILT=[1, 603, 604];
var q=new URLSearchParams(location.search),page=parseInt(q.get('p'),10)||0;
var HZ=[591,604];
function fileOf(p){return BUILT.indexOf(p)>=0?(p===1?'index.html':'p'+p+'.html'):'bientot.html?p='+p;}
function targetOf(pg,code){return BUILT.indexOf(pg)>=0?(pg===1?'index.html':'p'+pg+'.html#s='+code):'bientot.html?p='+pg+'#s='+code;}
var opts='',sels=TABLE.filter(function(s){return s.page===page;});
TABLE.forEach(function(s){var lab=s.n+'. '+s.name+' · p. '+s.page+(BUILT.indexOf(s.page)>=0?'':' · bientôt');
  opts+='<option value="'+targetOf(s.page,s.code)+'"'+(sels.length&&sels[0].code===s.code?' selected':'')+'>'+lab+'</option>';});
opts+='<option value="lexique.html">Lexique (mot à mot)</option>';
var pv=(page>HZ[0]&&page<=HZ[1])?page-1:null,nx=(page>=HZ[0]&&page<HZ[1])?page+1:null;
document.getElementById('navbox').innerHTML='<nav class="nav"><div class="row"><select id="goSur" aria-label="Choisir une sourate">'+opts+'</select></div><div class="row">'+
 (nx?'<a href="'+fileOf(nx)+'">Page '+nx+' →</a>':'<span class="sp"></span>')+'<span class="pn">Page '+page+'</span>'+(pv?'<a href="'+fileOf(pv)+'">← Page '+pv+'</a>':'<span class="sp"></span>')+'</div>'+
 (pv?'<div class="hint">Glisse de droite à gauche pour aller à la page '+pv+'</div>':'')+'</nav>';
document.getElementById('t').textContent='Page '+page;
document.getElementById('s').textContent=sels.length?sels.map(function(s){return s.name;}).join(' · '):'';
document.getElementById('ready').innerHTML=BUILT.map(function(p){return '<a href="'+fileOf(p)+'">Page '+p+'</a>';}).join('');
window.__nav={prev:pv?fileOf(pv):null,next:nx?fileOf(nx):null};
</script>
<script>

(function(){
  var sel=document.getElementById('goSur');
  if(sel)sel.addEventListener('change',function(){location.href=sel.value;});
  var nv=window.__nav||{},prev=nv.prev,next=nv.next;
  var x0=0,y0=0,t0=0,ok=false;
  document.addEventListener('touchstart',function(e){
    var tg=e.target;if(e.touches.length!==1||(tg&&tg.closest&&tg.closest('.bar,select,input,.nav'))){ok=false;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();ok=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!ok)return;ok=false;var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-t0<800){
      if(dx<0&&prev)location.href=prev;else if(dx>0&&next)location.href=next;
    }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    var tg=e.target;if(tg&&tg.closest&&tg.closest('select,input'))return;
    if(e.key==='ArrowLeft'&&prev)location.href=prev;else if(e.key==='ArrowRight'&&next)location.href=next;
  });
  // ouverture sur une sourate précise : #s=code (aussi quand on change de sourate sur la même page)
  function applyHash(){
    var m=/[#&]s=([a-z0-9]+)/.exec(location.hash),code=m&&m[1];
    if(!code)return;
    var ps=document.getElementById('selS');
    if(ps&&ps.querySelector('option[value="'+code+'"]')&&ps.value!==code){ps.value=code;ps.dispatchEvent(new Event('change'));}
    if(sel){for(var i=0;i<sel.options.length;i++){if(sel.options[i].value.indexOf('#s='+code)>0){sel.selectedIndex=i;break;}}}
    var h=document.querySelector('.hit[data-id^="'+code+'-"]');
    if(h)setTimeout(function(){h.scrollIntoView({block:'center'});},300);
  }
  applyHash();window.addEventListener('hashchange',applyHash);
})();
</script>
</body></html>
