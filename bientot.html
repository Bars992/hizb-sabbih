    var tg=e.target;if(e.touches.length!==1||(tg&&tg.closest&&tg.closest('.bar,select,input,.nav'))){ok=false;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();ok=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!ok)return;ok=false;var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-t0<800){
      if(dx<0&&prev)location.href=prev;else if(dx>0&&next)location.href=next;
    }
  },{passive:true});
  document.addEventListener('keydown',function(e){
    var tg=e.target;if(tg&&tg.closest&&tg.closest('select,input'))return;
    if(e.key==='ArrowLeft'&&prev)location.href=prev;else if(e.key==='ArrowRight'&&next)location.href=next;
  });
  // ouverture sur une sourate précise : #s=code (aussi quand on change de sourate sur la même page)
  function applyHash(){
    var m=/[#&]s=([a-z0-9]+)/.exec(location.hash),code=m&&m[1];
    if(!code)return;
    var ps=document.getElementById('selS');
    if(ps&&ps.querySelector('option[value="'+code+'"]')&&ps.value!==code){ps.value=code;ps.dispatchEvent(new Event('change'));}
    if(sel){for(var i=0;i<sel.options.length;i++){if(sel.options[i].value.indexOf('#s='+code)>0){sel.selectedIndex=i;break;}}}
    var h=document.querySelector('.hit[data-id^="'+code+'-"]');
    if(h)setTimeout(function(){h.scrollIntoView({block:'center'});},300);
  }
  applyHash();window.addEventListener('hashchange',applyHash);
})();
</script>
</body></html>
