<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hizb Sabbih</title>
<meta name="theme-color" content="#1D5A44">
<style>html,body{height:100%;margin:0;background:#0A4B45;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;box-sizing:border-box}a{color:#E9C36A;font-weight:700}p{line-height:1.5;font-size:17px}</style>
</head><body><p id="m">Chargement de Hizb Sabbih…</p>
<script>
/* Ouvre toujours la version la plus récente : hizb-v74.html, hizb-v75.html, … (le dernier fichier envoyé sur le site). */
(function(){
 var m=document.getElementById('m'),h=location.hostname,K='hizbLatest',c=0,FIRST=74,SPAN=40,i,tries=[];
 if(!(/github\.io$/.test(h)||h==='localhost'||h==='127.0.0.1')){m.innerHTML='Ceci est la <b>page d’accueil du site</b> Hizb Sabbih.<br><br>Téléversez-la sur GitHub.';return;}
 try{c=parseInt(localStorage.getItem(K),10)||0;}catch(e){}
 var fallback=c>=FIRST?'hizb-v'+c+'.html':'index-7.html';
 function go(f){location.replace(f+location.search+location.hash);}
 var from=Math.max(FIRST,c+1);for(i=from+SPAN-1;i>=from;i--)tries.push(i);
 Promise.all(tries.map(function(n){return fetch('hizb-v'+n+'.html',{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok?n:0;}).catch(function(){return 0;});})).then(function(a){
  var best=Math.max.apply(null,a.concat([0]));
  if(best>0){try{localStorage.setItem(K,String(best));}catch(e){}go('hizb-v'+best+'.html');}else go(fallback);
 });
})();
</script></body></html>
