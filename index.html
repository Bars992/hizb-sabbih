<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hizb Sabbih</title></head><body style="font-family:sans-serif;padding:24px;color:#444"><p>Chargement…</p><script>
(function(){var ns=[];for(var n=80;n>=1;n--)ns.push(n);Promise.all(ns.map(function(n){return fetch('hizb-v'+n+'.html',{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok?n:0;}).catch(function(){return 0;});})).then(function(r){var best=Math.max.apply(null,r);location.replace(best?('hizb-v'+best+'.html'):'accueil.html');});})();
</script></body></html>
