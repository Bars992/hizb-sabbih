<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hizb Sabbih</title>
<meta name="theme-color" content="#1D5A44">
<style>html,body{height:100%;margin:0;background:#0A4B45;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;box-sizing:border-box}a{color:#E9C36A;font-weight:700}p{line-height:1.5;font-size:17px}</style>
</head><body><p id="m">Chargement de Hizb Sabbih…</p>
<script>
// Opens the newest version that really exists on the site (it tries the plain name, then the name GitHub or the phone may have added "-1" to).
(function(){
 var C=['hizb-v68.html','hizb-v68-1.html','hizb-v68-2.html','hizb-v64.html'],m=document.getElementById('m'),h=location.hostname;
 if(!(/github\.io$/.test(h)||h==='localhost'||h==='127.0.0.1')){m.innerHTML='Ceci est la <b>page d’accueil du site</b> Hizb Sabbih.<br><br>Elle ne s’affiche pas ici : <b>téléchargez ce fichier</b>, puis téléversez-le sur GitHub.';return;}
 (function go(i){
  if(i>=C.length){m.innerHTML='Hizb Sabbih est en cours de mise à jour.<br><br><a href="hizb-v64.html">Ouvrir la version précédente</a>';return;}
  fetch(C[i],{method:'HEAD',cache:'no-store'}).then(function(r){if(r.ok)location.replace(C[i]+location.search+location.hash);else go(i+1);}).catch(function(){go(i+1);});
 })(0);
})();
</script></body></html>
